services:
  - type: web
    name: lowkey-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOT_OWNER_IDS
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
